name: Build Rune Companion Remix APK

on:
  push:
    branches: [rune-companion-remix-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Repair corrupted source tail
        run: |
          head -n 10502 app/src/main/java/com/example/viewmodel/PetViewModel.kt > PetViewModel.fixed
          printf '        return true\n    }\n}\n' >> PetViewModel.fixed
          mv PetViewModel.fixed app/src/main/java/com/example/viewmodel/PetViewModel.kt
      - name: Create debug signing key
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RuneCompanion-Remix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RuneCompanion-Remix-APK
          path: RuneCompanion-Remix.apk
          if-no-files-found: error
